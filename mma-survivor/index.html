<style>
/* Layout: light canvas, black brand bar on top, one black main-event slab as the single bold moment,
   quiet white fight cards with stacked fighter rows. Phone: bottom tab bar + pick sheet.
   Desktop (>=1080px): tabs in the top bar, content column + sticky side panel. */
:root{
  --canvas:#ececea; --surface:#ffffff; --surface-2:#f6f6f4; --line:#e0dfda; --line-2:#cfcdc6;
  --ink:#000000; --ink-2:#3d3c39; --muted:#77756f; --faint:#a9a7a0;
  --gold:#d4af37; --gold-2:#e9cd6c; --gold-ink:#8a6710; --gold-tint:#fbf3d9;
  --win:#13a052; --win-tint:#e5f5ec; --loss:#dc3a3a; --loss-tint:#fcebeb; --live:#e8222b;
  --bar:#000000; --on-bar:#ffffff; --on-bar-2:#a7a6a2;
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --r:14px; --r-sm:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--canvas)}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img{max-width:100%}
.c{font-stretch:72%;font-weight:800;letter-spacing:-.005em}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);color:var(--on-bar)}
.bar .in{position:relative;max-width:1120px;margin:0 auto;padding:0 16px;height:64px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--on-bar);flex:none}
.brand img{height:54px;width:auto;display:block;filter:drop-shadow(0 0 10px rgba(212,175,55,.22))}
.topnav{display:none;gap:4px;margin-left:12px;flex:1}
.topnav button{padding:8px 12px;border-radius:8px;color:var(--on-bar-2);font-weight:600}
.topnav button:hover{color:var(--on-bar)}
.topnav button[aria-current="true"]{color:var(--on-bar);box-shadow:inset 0 -2px 0 var(--gold)}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.me-btn{display:flex;align-items:center;gap:8px;color:var(--on-bar);font-weight:600;padding:4px 4px 4px 10px;border-radius:999px;border:1px solid #2c2c2c}
.me-btn:hover{border-color:#555}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;font-weight:700;font-size:15px;white-space:nowrap}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#262626}
.dlg-logo{display:block;width:118px;height:auto;margin:2px auto 10px}
.btn-gold{background:var(--gold);color:#000}
.btn-gold:hover{background:var(--gold-2)}
.btn-ghost{border:1px solid var(--line-2);background:var(--surface)}
.btn-ghost:hover{border-color:var(--ink-2)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn-sm{height:36px;padding:0 14px;font-size:14px;border-radius:9px}
.link{color:var(--gold-ink);font-weight:700}
.link:hover{text-decoration:underline}

/* ---------- avatars ---------- */
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;font-weight:800;font-stretch:72%;font-size:15px;color:var(--ink-2)}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.av.s{width:28px;height:28px;font-size:11px}
.av.m{width:34px;height:34px;font-size:12px}
.av.l{width:64px;height:64px;font-size:22px}
.bar .av{border-color:#333;background:#1b1b1b;color:#ddd}

/* ---------- page ---------- */
.page{max-width:1120px;margin:0 auto;padding:20px 16px 120px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.main{min-width:0;max-width:680px;width:100%;margin:0 auto}
.aside{display:none}

/* event header */
.ev-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ev-week{color:var(--muted);font-weight:600}
.ev-week b{color:var(--ink)}
.wkbtns{display:flex;gap:6px}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:16px;height:16px}
.iconbtn[disabled]{opacity:.3;cursor:default}
.ev-title{font-size:clamp(32px,8vw,46px);line-height:.98;margin:6px 0 10px;text-wrap:balance}
.ev-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;color:var(--ink-2);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-weight:700;font-size:13px;background:var(--surface);border:1px solid var(--line-2)}
.pill svg{width:14px;height:14px}
.pill.gold{border-color:var(--gold);background:var(--gold-tint);color:var(--gold-ink)}
.pill.live{border-color:var(--live);color:var(--live);background:#fff}
.pill.live i{width:7px;height:7px;border-radius:50%;background:var(--live);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

/* welcome / entries switcher */
.welcome{margin-top:18px;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.welcome p{margin:0;max-width:40ch;font-weight:500;color:var(--ink-2)}
.welcome p b{color:var(--ink);display:block;font-size:17px;margin-bottom:2px}
.mystatus{margin-top:18px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.mystatus .t{flex:1;min-width:0;color:var(--ink-2);font-weight:500;font-size:14px}
.mystatus .t b{display:block;color:var(--ink);font-size:16px;font-weight:700;margin-bottom:1px}
.mystatus .t .link{font-size:14px}
.mystatus.need{border-color:#efc4c4;background:#fff8f8}
.mystatus.need .t b{color:var(--loss)}
.mystatus.out{background:var(--surface-2)}

.tok{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 3px var(--gold-2)}
.tok.off{background:var(--line-2);box-shadow:none}

/* main event slab — the one dark, bold element */
.headliner{margin-top:22px;border-radius:18px;background:#000;color:#fff;overflow:hidden;position:relative}
.headliner::before{content:"";position:absolute;inset:auto 0 0 0;height:60%;background:radial-gradient(70% 90% at 50% 100%,rgba(212,175,55,.32),transparent 70%);pointer-events:none}
.hl-top{position:relative;z-index:1;display:flex;justify-content:space-between;padding:14px 16px 0;font-size:13px;font-weight:600;color:#bdbbb4}
.hl-top b{color:var(--gold-2);font-weight:700}
.hl-row{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:end}
.hl-side{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 4px 14px;border-radius:14px;min-width:0;text-align:center}
.hl-side:not([disabled]):hover .hl-cut img{transform:translateY(-3px)}
.hl-side[disabled]{cursor:default}
.hl-cut{height:200px;width:100%;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.hl-cut img{height:100%;width:auto;max-width:none;object-fit:contain;object-position:bottom;transition:transform .2s}
.hl-cut img.flip{transform:scaleX(-1)}
.hl-cut img.hs{height:76%}
.hl-name{font-size:26px;line-height:1;margin-top:8px}
.hl-sub{font-size:13px;color:#bdbbb4;margin-top:4px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.hl-vs{font-size:22px;color:var(--gold);padding-bottom:58px}
.hl-pick{margin-top:12px;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 18px;border-radius:999px;border:1px solid #4a4a4a;font-weight:700;font-size:14px;color:#fff;background:#141414}
.hl-pick svg{width:13px;height:13px}
.hl-side:not([disabled]):hover .hl-pick{border-color:var(--gold);color:var(--gold-2)}
.hl-side.sel .hl-pick{background:var(--gold);border-color:var(--gold);color:#000}
.notice{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--gold-tint);border:1px solid #efdc9a;font-weight:600;color:var(--ink-2);font-size:14px}
.frow[disabled]:not(.sel):not(.won) .radio{visibility:hidden}
.hl-tag{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:2;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--gold);color:#000;white-space:nowrap}
.hl-tag.used{background:#333;color:#ccc}
.hl-tag.won{background:var(--win);color:#fff}
.hl-tag.lost{background:var(--loss);color:#fff}
.hl-side.lost .hl-cut img,.hl-side.used .hl-cut img{filter:grayscale(1) brightness(.55)}
.hl-foot{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px 14px;border-top:1px solid #222;font-size:13px;color:#bdbbb4}
.hl-foot .res{color:#fff;font-weight:700}
.ph-dark{height:100%;aspect-ratio:5/6;display:flex;align-items:flex-end;justify-content:center;position:relative}
.ph-dark svg{position:absolute;inset:auto 0 0 0;width:100%}
.ph-dark b{position:relative;margin-bottom:20%;font-size:30px;font-weight:800;font-stretch:72%;color:var(--gold)}

/* fight list */
.seg{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.seg h2{margin:0;font-size:22px}
.seg span{color:var(--muted);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:5px}
.seg span svg{width:14px;height:14px}
.fights{display:flex;flex-direction:column;gap:10px}
.fight{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.f-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px;font-size:13px;color:var(--muted);font-weight:600}
.f-head .tape-btn{color:var(--ink-2);font-weight:700;display:inline-flex;align-items:center;gap:4px;padding:2px 0}
.f-head .tape-btn svg{width:13px;height:13px;transition:transform .15s}
.f-head .tape-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.frow{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto 24px;align-items:center;gap:12px;padding:9px 14px;text-align:left;position:relative}
.frow + .frow{border-top:1px solid var(--surface-2)}
.frow:not([disabled]):hover{background:var(--surface-2)}
.frow[disabled]{cursor:default}
.fname{min-width:0}
.fname b{display:block;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fname small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.flag{width:18px;height:12px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.odds{display:flex;align-items:center;gap:6px;font-size:16px;font-stretch:80%;font-weight:700;color:var(--ink-2)}
.favtag{font-size:11px;font-weight:800;color:var(--gold-ink);background:var(--gold-tint);border:1px solid var(--gold);padding:1px 6px;border-radius:999px;font-stretch:100%}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center}
.radio svg{width:12px;height:12px;color:#000;opacity:0}
.frow.sel{background:var(--gold-tint)}
.frow.sel .radio{border-color:var(--gold);background:var(--gold)}
.frow.sel .radio svg{opacity:1}
.frow.used,.frow.lost{opacity:.5}
.frow.won .radio{border-color:var(--win);background:var(--win)}
.frow.won .radio svg{opacity:1;color:#fff}
.frow.sel.won{background:var(--win-tint)}
.frow.sel.lost{background:var(--loss-tint);opacity:1}
.frow.sel.lost .radio{border-color:var(--loss);background:var(--loss)}
.frow.sel.lost .radio svg{color:#fff}
.mytag{font-size:12px;font-weight:700;color:var(--gold-ink)}
.frow.sel.won .mytag{color:var(--win)}.frow.sel.lost .mytag{color:var(--loss)}
.f-foot{padding:9px 14px 11px;border-top:1px solid var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.f-foot .canc{color:var(--loss)}
.popbar{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600}
.popbar i{display:block;width:80px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.popbar i b{display:block;height:100%;background:var(--gold)}
.tape{padding:4px 14px 12px;border-top:1px solid var(--surface-2)}
.tape table{width:100%;border-collapse:collapse;font-size:14px}
.tape td{padding:6px 0;text-align:center;font-weight:600;border-bottom:1px solid var(--surface-2)}
.tape td:first-child,.tape td:last-child{width:32%}
.tape td.l{color:var(--muted);font-weight:500;font-size:13px}
.tape td.edge{color:var(--gold-ink);font-weight:800}
.tape tr:first-child td{font-weight:700;color:var(--ink)}
.empty{padding:36px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);margin-top:22px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* ---------- pick sheet ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.38)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:20px 20px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.18);animation:up .2s ease-out;max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 14px}
.sheet .who{display:flex;align-items:center;gap:12px}
.sheet .who small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.sheet .who b{display:block;font-size:26px;line-height:1.05}
.sheet h4{margin:18px 0 8px;font-size:14px;font-weight:700;color:var(--ink-2)}
.sheet .who .pct{margin-top:4px;color:var(--ink-2)}
.note{margin-top:10px;font-size:13px;color:var(--muted);font-weight:500}
.sheet .actions{display:flex;gap:10px;margin-top:18px}
.sheet .actions .btn{flex:1}

/* dialogs (auth, profile, share) reuse the sheet on phones, centered card on desktop */
.dlg h3{margin:4px 0 4px;font-size:28px}
.dlg .sub{margin:0 0 16px;color:var(--muted);font-weight:500}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:var(--ink-2)}
.field input{height:48px;border-radius:10px;border:1px solid var(--line-2);padding:0 14px;font:inherit;font-size:16px;background:var(--surface)}
.field input:focus{outline:none;border-color:var(--ink)}
.field .hint{font-size:13px;color:var(--muted)}
.err{color:var(--loss);font-weight:600;font-size:14px;min-height:20px;margin:-4px 0 8px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:4px;margin-bottom:16px}
.tabs2 button{height:38px;border-radius:8px;font-weight:700;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.photo{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.photo .acts{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.photo .hint{font-size:13px;color:var(--muted)}
.photo input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo label.btn{cursor:pointer}
.photo:focus-within label.btn{outline:2px solid var(--gold);outline-offset:2px}
.av.xl{width:84px;height:84px;font-size:28px;border-width:2px}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--surface-2);color:var(--ink)}
.sharewrap img{width:100%;border-radius:12px;display:block}

/* ---------- entries ---------- */
.h1{font-size:30px;margin:0}
.lead{margin:4px 0 0;color:var(--muted);font-weight:500}
.track{margin:14px 0 0;padding:16px 16px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.track .line{position:relative;height:6px;border-radius:3px;background:var(--surface-2);margin:26px 8px 16px}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--gold)}
.track .mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.track .mk.hit{border-color:var(--gold);background:var(--gold)}
.track .mk span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-weight:800;font-stretch:72%;font-size:15px}
.track .mk em{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;font-weight:600}
.track .mk:first-child em{left:0;transform:none}
.track .mk:last-child em{left:auto;right:0;transform:none}
.track p{margin:0;font-size:14px;color:var(--ink-2);font-weight:500}
.ecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.ecard.out{background:transparent}
.ec-top{display:flex;align-items:center;gap:12px}
.ec-top .n{font-size:22px}
.badge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}
.badge.alive{background:var(--win-tint);color:var(--win)}
.badge.out{background:var(--loss-tint);color:var(--loss)}
.ec-top .wins{margin-left:auto;text-align:right;line-height:1}
.ec-top .wins b{font-size:30px;display:block}
.ec-top .wins small{color:var(--muted);font-weight:600;font-size:12px}
.ec-meta{margin:6px 0 12px;color:var(--muted);font-size:14px;font-weight:500;display:flex;gap:16px;flex-wrap:wrap}
.weeks{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.wk{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);width:42px}
.wk .av{width:38px;height:38px;border-width:2px}
.wk.win .av{border-color:var(--win)}
.wk.loss .av{border-color:var(--loss)}
.wk.pend .av{border-color:var(--gold)}
.wk.push .av{border-color:var(--faint)}
.wk.need .av{border:2px dashed var(--loss);background:transparent;color:var(--loss);font-size:10px}
.wk.none .av{border-style:dashed;background:transparent}
.season-head{display:flex;align-items:center;gap:14px}
.season-head .t{flex:1;min-width:0}
.season-head .t b{display:block;font-size:26px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.season-head .t span{display:flex;gap:8px;align-items:center;margin-top:5px;color:var(--muted);font-size:14px;font-weight:500}
.season-head .wins{text-align:right;line-height:1}
.season-head .wins b{font-size:44px;display:block}
.season-head .wins small{color:var(--muted);font-weight:600;font-size:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.box h3{margin:0 0 12px;font-size:19px;display:flex;justify-content:space-between;align-items:baseline}
.box h3 small{font-size:13px;font-stretch:100%;font-weight:600;color:var(--muted)}
.box p{margin:0;color:var(--ink-2);font-weight:500;font-size:14px}

/* ---------- leaderboard ---------- */
.lb-tools{display:flex;gap:10px;align-items:center;margin:18px 0 12px;flex-wrap:wrap}
.segc{display:inline-grid;grid-auto-flow:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.segc button{height:34px;padding:0 14px;border-radius:7px;font-weight:700;color:var(--muted)}
.segc button[aria-pressed="true"]{background:var(--ink);color:#fff}
.search{flex:1;min-width:150px;height:42px;border-radius:10px;border:1px solid var(--line);padding:0 14px;font:inherit;background:var(--surface)}
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lrow{display:grid;grid-template-columns:36px 34px minmax(0,1fr) 32px 46px;gap:12px;align-items:center;padding:10px 14px}
.lrow + .lrow{border-top:1px solid var(--surface-2)}
.lrow.me{background:var(--gold-tint)}
.lrow.out{color:var(--muted)}
.lrow.out .av{filter:grayscale(1);opacity:.7}
.rk{font-size:20px;text-align:center}
.rk.top{color:var(--gold-ink)}
.lname{min-width:0}
.lname b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname small{color:var(--muted);font-size:13px;font-weight:500}
.lwins{font-size:24px;text-align:right}
.lpick{display:flex;justify-content:center;color:var(--faint)}
.lpick svg{width:15px;height:15px}
.more{display:flex;justify-content:center;padding:12px;border-top:1px solid var(--surface-2)}
.myrank{display:flex;align-items:center;gap:12px;margin:16px 0 0;padding:10px 14px;border-radius:var(--r);background:var(--gold-tint);border:1px solid #efdc9a;font-weight:600;color:var(--ink-2)}
.myrank b{color:var(--ink)}
.myrank .rk{font-size:24px;color:var(--gold-ink);min-width:36px}

/* ---------- rules ---------- */
.prizes{margin:18px 0 26px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prize{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;padding:12px 16px}
.prize + .prize{border-top:1px solid var(--surface-2)}
.prize .n{font-size:30px;line-height:1;text-align:center}
.prize .n small{display:block;font-size:12px;font-weight:600;font-stretch:100%;color:var(--muted)}
.prize b{display:block;font-weight:700}
.prize span{color:var(--ink-2);font-weight:500}
.prize.champ{background:#000;color:#fff}
.prize.champ span,.prize.champ .n small{color:#bdbbb4}
.prize.champ .n{color:var(--gold)}
.prizes .tease{padding:14px 16px;background:var(--gold-tint);border-bottom:1px solid #efe1b4}
.prizes .tease b{display:block;font-size:17px;font-weight:800}
.prizes .tease span{color:var(--ink-2);font-weight:500}
.prize .soon{display:inline-flex;align-items:center;gap:6px;color:var(--gold-ink);font-weight:700}
.prize .soon svg{width:14px;height:14px}
.prize.champ .soon{color:var(--gold);display:inline}
.h2{font-size:22px;margin:0 0 10px}
.rules{margin:0;padding:0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rules li{padding:12px 16px;font-weight:500;color:var(--ink-2);line-height:1.45}
.rules li + li{border-top:1px solid var(--surface-2)}
.rules li b{color:var(--ink)}
details.fine{margin-top:14px;color:var(--muted);font-size:13px;line-height:1.55}
details.fine summary{cursor:pointer;font-weight:700;color:var(--ink-2)}
details.fine p{max-width:68ch}

/* ---------- side panel (desktop) ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:19px;display:flex;justify-content:space-between;align-items:baseline}
.panel h3 button{font-size:14px;font-stretch:100%;font-weight:700;color:var(--gold-ink)}
.prow{display:flex;align-items:center;gap:10px;padding:7px 0}
.prow + .prow{border-top:1px solid var(--surface-2)}
.prow .t{flex:1;min-width:0;font-weight:600}
.prow .t small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.prow .w{font-size:20px}

/* ---------- bottom nav (phones) ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar button[aria-current="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.tabbar .dot{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--loss);border:2px solid var(--surface)}

footer{background:#000;color:#8d8b85;font-size:13px}
footer .in{max-width:1120px;margin:0 auto;padding:22px 16px calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:14px 24px;align-items:center;flex-wrap:wrap;justify-content:space-between}
footer img{height:22px;width:auto;display:block}
.ad-slot{max-width:1120px;margin:0 auto;padding-inline:16px}
.ad-slot:not(:empty){padding-block:16px}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;width:max-content;max-width:min(92vw,440px);background:#000;color:#fff;padding:10px 14px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--loss)}
.toast{border:1px solid rgba(255,255,255,.16)}
.demo-wrap{max-width:1120px;margin:0 auto;padding:12px 16px 0;display:flex;justify-content:flex-end}
.demo{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:999px;background:var(--surface);border:1px dashed var(--gold);font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.demo button{height:30px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:13px}
.demo button.go{background:var(--ink);color:#fff}
.demo button[aria-pressed="true"]{background:var(--gold);color:#000}
/* HOF wordmark in the top bar */
.hofmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;line-height:0}
.hofmark img{height:20px;width:auto;display:block}
@media (min-width:1080px){.hofmark{position:static;transform:none;padding-left:18px;border-left:1px solid #2c2c2c}.hofmark img{height:18px}}
/* tappable player rows */
button.lrow,button.prow,button.arow{width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;background:none}
button.lrow:hover,button.arow:hover{background:var(--surface-2)}
button.lrow.me:hover{background:#f7ecc8}
.fstar{color:var(--gold);margin-left:6px;font-size:13px}
.av.xxl{width:112px;height:112px;font-size:38px;border-width:3px;border-color:var(--gold)}
/* player profile */
.dlg.player{max-height:90vh;overflow-y:auto}
.pl-head{display:flex;gap:16px;align-items:center;margin:4px 0 2px;padding-right:30px}
.pl-head .avbtn{border-radius:50%;flex:none;cursor:zoom-in}
.pl-head .avbtn[disabled]{cursor:default}
.pl-head .t{min-width:0;flex:1}
.pl-head .t b{display:block;font-size:28px;line-height:1.05;overflow-wrap:anywhere}
.pl-head .t small{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-weight:600;font-size:13px;margin-top:6px}
.pl-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.soc{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--ink);text-decoration:none}
.soc:hover{border-color:var(--ink-2)}
.soc svg{width:16px;height:16px}
.pl-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 0}
.pl-stats div{background:var(--surface-2);border-radius:12px;padding:12px 6px;text-align:center}
.pl-stats b{display:block;font-size:26px;line-height:1}
.pl-stats small{display:block;margin-top:5px;color:var(--muted);font-weight:600;font-size:11px;line-height:1.25}
.pl-bold{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--gold-tint);font-size:14px;font-weight:500;color:var(--ink-2)}
.pl-bold b{color:var(--ink)}
.pl-sec{margin:18px 0 8px;font-size:14px;font-weight:700;color:var(--ink-2)}
.wk.hid .av{border-style:dashed;background:transparent;color:var(--faint)}
.wk.hid .av svg{width:14px;height:14px}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:min(88vw,560px);max-height:80vh;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
/* profile editing: socials */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two > .field{min-width:0}
.handle{min-width:0}
.handle{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);height:48px;padding-left:12px}
.handle span{color:var(--muted);font-weight:700}
.field .handle input{border:0;height:46px;flex:1;min-width:0;padding:0 10px 0 3px;border-radius:10px}
.handle:focus-within{border-color:var(--ink)}
.switch{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;color:var(--ink-2);margin:-2px 0 14px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--ink);flex:none}
/* admin */
.adm-note{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--gold-ink);background:var(--gold-tint);border-radius:999px;padding:4px 10px;margin-top:8px}
.adm-note svg{width:13px;height:13px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:28px;line-height:1}
.tile small{display:block;margin-top:6px;color:var(--muted);font-weight:600;font-size:12px}
.tile.warn b{color:var(--loss)}
@media (min-width:760px){.tiles{grid-template-columns:repeat(6,1fr)}}
.split{display:grid;gap:10px}
.srow{display:grid;grid-template-columns:28px minmax(0,1fr) 52px;gap:4px 10px;align-items:center;font-size:14px;font-weight:600}
.srow .bar2{grid-column:2/4;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.srow .bar2 i{display:block;height:100%;background:var(--gold)}
.arow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px}
.arow + .arow{border-top:1px solid var(--surface-2)}
.arow .t{min-width:0}
.arow .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .t small{display:block;color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .pk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;text-align:right}
.arow .pk small{display:block;color:var(--muted);font-weight:500}
.arow .pk.none{color:var(--loss)}

/* leaderboard: one row per player, one cell per week (like a pick sheet) */
.lbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.lbgrid{display:grid;min-width:max-content;--lead:250px;--cw:96px}
.lg-head,.lg-row{display:grid;grid-template-columns:var(--lead) repeat(var(--n),var(--cw));align-items:stretch}
.lg-head{background:var(--surface-2);border-bottom:1px solid var(--line)}
.lg-head > div{padding:8px 6px;font-size:11.5px;line-height:1.2;font-weight:700;color:var(--muted);text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;align-self:center}
.lg-head > div.cur{color:var(--ink)}
.lg-head .lg-lead{display:flex;justify-content:space-between;align-items:center;align-self:stretch;padding-left:14px;padding-right:14px;background:var(--surface-2)}
button.lg-row{width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);cursor:pointer;padding:0}
.lg-row + .lg-row{border-top:1px solid var(--surface-2)}
.lg-lead{position:sticky;left:0;z-index:1;background:var(--surface);display:grid;grid-template-columns:30px 34px minmax(0,1fr) 30px;gap:8px;align-items:center;padding:8px 10px 8px 12px;border-right:1px solid var(--line)}
button.lg-row:hover,button.lg-row:hover .lg-lead{background:var(--surface-2)}
.lg-row.me,.lg-row.me .lg-lead{background:var(--gold-tint)}
.lg-lead .rk{font-size:19px}
.lg-lead .lwins{font-size:22px;text-align:right}
.lbsub{display:block;color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{margin:6px 4px;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;padding:5px 2px;font-size:10px;font-weight:800;color:var(--ink-2);text-transform:uppercase;overflow:hidden;min-width:0}
.cell .av{width:34px;height:34px}
.cell span:not(.av){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.cell.win{background:var(--win-tint);border-color:#8fd0ab}
.cell.loss{background:var(--loss-tint);border-color:#eeaaaa}
.cell.loss .av{filter:grayscale(1)}
.cell.pend{border-color:var(--gold);background:#fffdf4}
.cell.hid{border-style:dashed;color:var(--faint)}
.cell.hid svg{width:16px;height:16px}
.cell.none{border-style:dashed;background:transparent}
/* tappable "Make your pick" */
button.mystatus{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.mystatus .go{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--loss);color:#fff}
.mystatus .go svg{width:16px;height:16px}
button.mystatus.need:hover{border-color:var(--loss)}
.mystatus .btn{flex:none}
#card-top{scroll-margin-top:80px}
.mainlbl{color:var(--gold-ink);font-weight:800}
/* share dialog */
.sharewrap{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;padding:10px}
.sharewrap img{max-height:58vh;width:auto;max-width:100%}
.share-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.shbtn{height:68px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:13.5px;color:#fff;line-height:1.1}
.shbtn svg{width:23px;height:23px}
.sh-ig{background:linear-gradient(45deg,#f27a1a 0%,#d62976 42%,#962fbf 78%,#4f5bd5 100%)}
.sh-x{background:#000;text-decoration:none}
.savepic{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.savepic img{max-width:min(92vw,520px);max-height:72vh;border-radius:10px;-webkit-touch-callout:default;user-select:auto}
.savepic p{margin:0;color:#fff;font-weight:700;text-align:center;font-size:16px}
.savepic button{height:46px;padding:0 26px;border-radius:10px;background:#fff;color:#000;font-weight:800}
.sh-save{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.sh-save:hover{border-color:var(--ink-2)}
.shnote{margin:12px 0 0;text-align:center;font-size:14px;font-weight:600;color:var(--ink-2);min-height:20px}
.shlink{display:block;margin:6px auto 0;font-size:13.5px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px 10px}
@media (max-width:560px){.hide-s{display:none}.lbgrid{--lead:176px;--cw:70px}.lg-lead{grid-template-columns:24px minmax(0,1fr) 26px;gap:6px;padding-left:10px}.lg-lead .av{display:none}.lg-lead .lwins{font-size:20px}}
@media (min-width:760px){
  .hl-cut{height:250px}
  .hl-name{font-size:32px}
  .sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:20px;animation:none}
  .grab{display:none}
}
@media (min-width:1080px){
  .topnav{display:flex}
  .tabbar{display:none}
  .page{grid-template-columns:minmax(0,1fr) 330px;padding-bottom:60px}
  .main{margin:0}
  .aside{display:block;position:sticky;top:78px;align-self:start}
  footer .in{padding-bottom:22px}
  .toast{bottom:24px}
}
@media (max-width:380px){
  .frow{gap:10px;padding-inline:12px}
  .hl-cut{height:170px}
  .hl-name{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- formatting ---------- */
const initials = (name) => String(name || '?').split(/[\s_.]+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join('').toUpperCase() || '?';
const lastName = (f) => f ? (f.last_name || String(f.name).split(' ').slice(-1)[0]) : 'TBA';
const fmtDay = (t) => new Date(t).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const fmtTime = (t) => new Date(t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const fmtShort = (t) => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
function countdown(ms) {
  if (ms <= 0) return 'now';
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  return d > 0 ? `${d}d ${h}h` : h > 0 ? `${h}h ${mm}m` : `${mm}m`;
}
function eventTitle(ev) {
  const n = ev?.name || '';
  const i = n.indexOf(':');
  return i > -1 ? { pre: n.slice(0, i).trim(), main: n.slice(i + 1).trim() } : { pre: '', main: n };
}
// Short column label for an event: "UFC 333" for numbered events, otherwise the headline ("Buckley vs. Malott")
function eventShort(ev) {
  const n = ev?.name || '';
  const m = n.match(/^UFC\s+\d+/i);
  return m ? m[0].toUpperCase() : (eventTitle(ev).main || n);
}
const methodLabel = { KO: 'KO/TKO', SUB: 'submission', DEC: 'decision' };
const flagCode = (url) => (String(url || '').match(/countries\/500\/([a-z]+)\.png/) || [])[1];
// Chance to win from the moneyline pair, with the sportsbook margin removed (same formula as the database)
const impl = (o) => o == null ? null : o < 0 ? -o / (-o + 100) : 100 / (o + 100);
function winPct(self, other) {
  const s = impl(self), o = impl(other);
  if (s == null) return null;
  return Math.round(100 * (o == null ? s : s / (s + o)));
}

/* ---------- week lock: the whole card locks when its first fight starts ---------- */
function lockAtOf(ev, fights) {
  const ts = (fights || []).filter((f) => f.status !== 'canceled').map((f) => Date.parse(f.lock_at)).filter(Number.isFinite);
  if (ev?.starts_at) ts.push(Date.parse(ev.starts_at));
  return ts.length ? Math.min(...ts) : Infinity;
}
function weekLocked(ev, fights) {
  if (!ev) return true;
  if (ev.status === 'live' || ev.status === 'final') return true;
  if ((fights || []).some((f) => f.status === 'live' || f.status === 'final')) return true;
  return now() >= lockAtOf(ev, fights);
}

const AV_TONES = ['#efe4c4', '#dde6ee', '#e7dfee', '#dcebe1', '#f1dfd6', '#e4e3dc'];
function tone(name) { let h = 0; for (const ch of String(name || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return AV_TONES[h % AV_TONES.length]; }
function avatarHTML(url, name, size = '') {
  if (url) return `<span class="av ${size}"><img src="${esc(url)}" alt="" loading="lazy" data-avini="${esc(initials(name))}"></span>`;
  return `<span class="av ${size}" style="background:${tone(name)}">${esc(initials(name))}</span>`;
}
function cutoutHTML(f, side) {
  const ph = `<span class="ph-dark">${BUST}<b>${esc(initials(f?.name))}</b></span>`;
  if (!f) return ph;
  const chain = [];
  const own = side === 'L' ? f.stance_left_url : f.stance_right_url;
  const other = side === 'L' ? f.stance_right_url : f.stance_left_url;
  if (own) chain.push([own, 0, 0]);
  if (other) chain.push([other, 1, 0]);
  if (f.headshot_url) chain.push([f.headshot_url, 0, 1]);
  if (!chain.length) return ph;
  const [src, flip, hs] = chain.shift();
  return `<img class="${flip ? 'flip ' : ''}${hs ? 'hs' : ''}" src="${esc(src)}" alt="${esc(f.name)}" loading="lazy" data-chain="${esc(JSON.stringify(chain))}" data-ini="${esc(initials(f.name))}">`;
}
function flagHTML(f) {
  if (!f?.flag_url) return '';
  return `<img class="flag" src="${esc(f.flag_url)}" alt="${esc(f.country || '')}" title="${esc(f.country || '')}" loading="lazy" data-cc="${esc((flagCode(f.flag_url) || '').toUpperCase())}">`;
}
document.addEventListener('error', (e) => {
  const el = e.target;
  if (!el || el.tagName !== 'IMG') return;
  if (el.dataset.chain !== undefined) {
    const chain = JSON.parse(el.dataset.chain || '[]');
    if (chain.length) {
      const [src, flip, hs] = chain.shift();
      el.dataset.chain = JSON.stringify(chain);
      el.classList.toggle('flip', !!flip); el.classList.toggle('hs', !!hs);
      el.src = src;
    } else el.outerHTML = `<span class="ph-dark">${BUST}<b>${esc(el.dataset.ini)}</b></span>`;
  } else if (el.dataset.avini !== undefined) {
    const box = el.parentElement; if (box) box.style.background = tone(el.dataset.avini);
    el.replaceWith(document.createTextNode(el.dataset.avini));
  } else if (el.dataset.cc !== undefined) el.remove();
}, true);

// Crop a photo to a square and shrink it before upload
async function squarePhoto(file, size) {
  if (!file || !/^image\//.test(file.type || 'image/')) throw new Error('Choose an image file (JPG, PNG or WebP).');
  if (file.size > 20 * 1024 * 1024) throw new Error('That photo is too large. Choose one under 20 MB.');
  const src = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("That photo couldn't be read. Try a JPG or PNG.")); i.src = src; });
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, size, size);
    x.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
    const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.86));
    return { blob, dataUrl: c.toDataURL('image/jpeg', 0.86) };
  } finally { URL.revokeObjectURL(src); }
}

      return { rows: data, total: count ?? data.length };
    },

  };
}

  // no live streak: the next pick starts a new one
  const fresh = !!(S.me?.profile && (!entry || entry.status !== 'alive'));
  const canPick = !!(isOpenWeek && !S.locked && S.me?.profile && S.season?.status !== 'complete' && (fresh || entry.start_week <= (ev?.week_no ?? 0)));

  const isDraft = !!(ctx.draft && ctx.draft.fightId === f.id && ctx.draft.fighterId === id);
  const sel = isDraft || (isPick && !ctx.draft);

    [a.reach, 'Reach', b.reach, n(a.reach), n(b.reach)],
    [a.stance, 'Stance', b.stance],
    [sa.strikeLPM, 'Strikes landed / min', sb.strikeLPM, n(sa.strikeLPM), n(sb.strikeLPM)],
    [pct(sa.strikeAccuracy), 'Striking accuracy', pct(sb.strikeAccuracy), n(sa.strikeAccuracy), n(sb.strikeAccuracy)],
    [sa.takedownAvg, 'Takedowns / 15 min', sb.takedownAvg, n(sa.takedownAvg), n(sb.takedownAvg)],
    [sa.submissionAvg, 'Sub attempts / 15 min', sb.submissionAvg, n(sa.submissionAvg), n(sb.submissionAvg)]
  ];
  return `<div class="tape"><table><tbody>${rows.map(([x, l, y, nx, ny]) => `<tr><td class="tnum ${nx != null && ny != null && nx > ny ? 'edge' : ''}">${esc(x ?? '–')}</td><td class="l">${l}</td><td class="tnum ${nx != null && ny != null && ny > nx ? 'edge' : ''}">${esc(y ?? '–')}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- pick sheet ---------- */
function renderSheet() {
  const root = $('#sheetroot');

  root.dataset.kind = 'pick';
  $('#toast').hidden = true;
  const fighter = fighterIn(d.fightId, d.fighterId);
  const f = S.fights.find((x) => x.id === d.fightId);
  const opp = f ? (f.a?.id === d.fighterId ? f.b : f.a) : null;
  const pct = pctOf(f, d.fighterId);
  const lockAt = lockAtOf(viewEvent(), S.fights);
  root.innerHTML = `<div class="scrim" data-act="cancelpick"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Confirm your pick">

    <p class="note">You can change it until the first fight starts${Number.isFinite(lockAt) ? ` (${esc(fmtDay(lockAt))}, ${esc(fmtTime(lockAt))})` : ''}. Nobody else sees your pick before then.</p>
    <div class="actions"><button class="btn btn-ghost" data-act="cancelpick">Cancel</button><button class="btn btn-dark" data-act="savepick" ${d.saving ? 'disabled' : ''}>${d.saving ? 'Saving…' : 'Confirm pick'}</button></div>
  </div>`;
}

/* ---------- MY SEASON ---------- */
function viewSeason() {
  if (!S.me?.profile) return `<h1 class="h1 c">My season</h1><div class="empty"><b>Not playing yet</b>Create a free profile and make your first pick.<div style="margin-top:14px"><button class="btn btn-dark" data-act="${S.me ? 'profile' : 'auth'}" data-mode="up">${S.me ? 'Create profile' : 'Play free'}</button></div></div>`;
  const prof = S.me.profile, e = S.entry;
  if (!e) return `<h1 class="h1 c">My season</h1><div class="empty"><b>No picks yet</b>Pick any fighter on this week's card to start your streak.<div style="margin-top:14px"><button class="btn btn-dark" data-act="gopick">Make my pick</button></div></div>`;
  const alive = e.status === 'alive', cur = alive ? e.wins : 0;
  const best = S.entries.reduce((m, x) => Math.max(m, x.wins), 0);
  const tiers = S.prizes.filter((p) => p.wins > 0).sort((a, b) => a.wins - b.wins);
  const max = tiers.length ? tiers[tiers.length - 1].wins : S.season.weeks;
  const next = tiers.find((t) => t.wins > cur), first = tiers[0];
  const rank = S.myRank?.rank;
  const open = S.openEvent, canStart = !alive && open && open.status !== 'final' && !openLocked() && S.season.status !== 'complete';
  let h = `<div class="season-head">${avatarHTML(prof.avatar_url, prof.username, 'l')}<span class="t"><b class="c">${esc(prof.username)}</b><span><span class="badge ${alive ? 'alive' : 'out'}">${alive ? 'On a streak' : 'Streak ended'}</span>${rank && best > 0 ? `Ranked #${rank}` : ''}${best > 0 ? `, best ${best}` : ''}</span></span>
    <span class="wins"><b class="c tnum">${cur}</b><small>in a row</small></span></div>`;
  let msg;
  if (!alive) msg = `Your streak ended in week ${e.out_week ?? ''} at ${plural(e.wins, 'win')}. ${canStart ? `<button class="link" data-act="gopick">Make your week ${open.week_no} pick</button> to start a new one.` : 'Start a new one when the next card opens.'}`;
  else if (next && !prizeText(next)) msg = first && cur < first.wins ? `Prizes start at ${first.wins} in a row 👀 ${first.wins - cur} to go.` : `Next unlock at ${next.wins} in a row. Prizes drop soon 👀`;
  else msg = next ? `Next prize at ${next.wins} in a row: ${esc(prizeText(next))}.` : 'Every milestone unlocked.';
  h += `<div class="track"><div class="line"><span class="fill" style="width:${Math.min(100, 100 * cur / max)}%"></span>${tiers.map((t) => `<span class="mk ${cur >= t.wins ? 'hit' : ''}" style="left:${100 * t.wins / max}%" title="${esc(prizeText(t) || 'Prize revealed soon')}"><span class="tnum">${t.wins}</span></span>`).join('')}</div><p>${msg}</p></div>`;
  const evByWeek = Object.fromEntries(S.events.filter((x) => x.week_no).map((x) => [x.week_no, x]));
  const curW = open?.week_no || 1;
  const startW = S.entries.reduce((m, x) => Math.min(m, x.start_week), 99);
  const pickWeeks = S.picks.map((p) => S.events.find((x) => x.id === p.event_id)?.week_no || 0);
  const last = Math.max(alive || canStart ? curW : (e.out_week || curW), ...pickWeeks);
  const weeks = []; for (let w = startW; w <= last; w++) weeks.push(w);
  h += `<div class="box"><h3 class="c">Your picks <small>${S.entries.length > 1 ? plural(S.entries.length, 'streak') : ''}</small></h3><div class="weeks">${weeks.map((w) => {
    const ev = evByWeek[w], p = ev && S.picks.find((x) => x.event_id === ev.id);
    if (p) return `<span class="wk ${p.result === 'pending' ? 'pend' : p.result}" title="Week ${w}: ${esc(p.fighter?.name || '')}">${avatarHTML(p.fighter?.headshot_url, p.fighter?.name)}W${w}</span>`;
    if (w === curW && (alive || canStart) && open?.status !== 'final' && !openLocked()) return `<button class="wk need" data-act="gopick"><span class="av">Pick</span>W${w}</button>`;
    return `<span class="wk none"><span class="av"></span>W${w}</span>`;
  }).join('')}</div>${pickFor(open?.id) ? `<div style="margin-top:12px"><button class="btn btn-dark btn-sm" data-act="share">${I.share} Share my pick</button></div>` : ''}</div>`;
  h += `<div class="box"><h3 class="c">Following <small>${S.following.size ? plural(S.following.size, 'player') : ''}</small></h3>${S.followRows.length
    ? S.followRows.map((r) => `<button class="prow" data-act="player" data-user="${esc(r.user_id)}">${avatarHTML(r.avatar_url, r.username, 'm')}<span class="t">${esc(r.username)}<small>${r.status === 'alive' ? (r.current > 0 ? `${r.current} in a row` : 'Alive') : 'Streak ended'}</small></span><span class="w c tnum" title="Best streak">${r.wins}</span></button>`).join('')
    : `<p>Follow players to keep an eye on their streaks here. Tap anyone on the <button class="link" data-act="tab" data-tab="board">leaderboard</button> to see their profile.</p>`}</div>`;
  h += `<p style="margin:14px 2px 0;display:flex;gap:16px;flex-wrap:wrap"><button class="link" data-act="player" data-user="${esc(S.me.user.id)}">See my profile</button><button class="link" data-act="profile">Edit profile, photo and socials</button></p>`;
  return h;
}

/* ---------- LEADERBOARD ---------- */
const rankOf = (r) => r.wins > 0 ? r.rank : '–';
const boardWeeks = () => { const cur = S.openEvent?.week_no ?? 0; return S.events.filter((e) => e.week_no != null && e.week_no <= cur).sort((a, b) => a.week_no - b.week_no); };
const streakLine = (r) => r.status === 'alive' ? (r.current > 0 ? `${r.current} in a row` : 'Alive') : 'Streak ended';
function cellHTML(r, ev) {
  const p = S.lb.picks[r.user_id]?.[ev.week_no];
  if (!p) return `<div class="cell none"></div>`;
  if (p.hidden) return `<div class="cell hid" title="Picked. Hidden until the card starts">${I.lock}</div>`;
  const cls = p.result === 'win' ? 'win' : p.result === 'loss' ? 'loss' : p.result === 'push' ? 'none' : 'pend';
  const label = `${eventShort(ev)}: ${p.fighter_name || ''}${p.result === 'win' ? ', won' : p.result === 'loss' ? ', lost' : ''}`;
  return `<div class="cell ${cls}" title="${esc(label)}">${avatarHTML(p.headshot_url, p.fighter_name, 's')}<span>${esc(p.last_name || lastName({ name: p.fighter_name }))}</span></div>`;
}
function lrowHTML(r, weeks) {
  const mine = S.me?.user && r.user_id === S.me.user.id;
  return `<button class="lg-row ${mine ? 'me' : ''}" data-act="player" data-user="${esc(r.user_id)}" aria-label="See ${esc(r.username)}'s profile">
    <div class="lg-lead"><span class="rk c tnum ${r.rank === 1 && r.wins > 0 ? 'top' : ''}">${rankOf(r)}</span>${avatarHTML(r.avatar_url, r.username, 'm')}<span class="lname"><b>${esc(r.username)}${mine ? ' (you)' : ''}${S.following.has(r.user_id) ? '<span class="fstar" title="Following">★</span>' : ''}</b><span class="lbsub">${streakLine(r)}</span></span><span class="lwins c tnum" title="Best streak">${r.wins}</span></div>
    ${weeks.map((ev) => cellHTML(r, ev)).join('')}</button>`;
}
function viewBoard() {
  const st = S.stats || { entries: 0, alive: 0, players: 0 };
  const weeks = boardWeeks();
  let h = `<h1 class="h1 c">Leaderboard</h1><p class="lead tnum">${st.alive.toLocaleString()} of ${st.players.toLocaleString()} players on a streak</p>`;
  if (S.myRank) {
    const r = S.myRank;
    h += r.wins > 0
      ? `<div class="myrank"><span class="rk c tnum">#${r.rank}</span><span>Your best streak is <b>${r.wins}</b>${r.status === 'alive' && r.current > 0 && r.current !== r.wins ? `. You're on ${r.current} in a row right now` : ''}.</span></div>`
      : `<div class="myrank"><span>${S.top.some((x) => x.wins > 0) ? 'No wins yet. Win your next pick to climb the board.' : "You're in. Rankings start once the first card is done."}</span></div>`;
  }
  const filters = [['all', 'All'], ['alive', 'On a streak'], ...(S.me?.profile ? [['following', `Following${S.following.size ? ` ${S.following.size}` : ''}`]] : [])];
  h += `<div class="lb-tools"><div class="segc" role="group" aria-label="Show">${filters.map(([k, l]) => `<button data-act="lbfilter" data-f="${k}" aria-pressed="${S.lb.filter === k}">${l}</button>`).join('')}</div>
  <input class="search" id="lbsearch" type="search" placeholder="Find a player" value="${esc(S.lb.q)}" aria-label="Find a player"></div>
  <div class="board">`;
  if (S.lb.rows.length) {
    h += `<div class="lbwrap" id="lbwrap"><div class="lbgrid" style="--n:${weeks.length}"><div class="lg-head"><div class="lg-lead"><span>Player</span><span title="Best streak">Best</span></div>${weeks.map((ev) => `<div class="${ev.id === S.openEvent?.id ? 'cur' : ''}" title="${esc(ev.name)}">${esc(eventShort(ev))}</div>`).join('')}</div>
      ${S.lb.rows.map((r) => lrowHTML(r, weeks)).join('')}</div></div>`;
  } else h += `<div class="empty" style="margin:0;border:0">${S.lb.filter === 'following' ? "You're not following anyone yet. Tap a player to see their profile and follow them." : S.lb.q ? 'No players match.' : 'No players yet. Be the first on the board.'}</div>`;
  if (S.lb.rows.length < S.lb.total) h += `<div class="more"><button class="btn btn-ghost btn-sm" data-act="lbmore">Show more</button></div>`;
  return h + `</div><details class="fine"><summary>How ranking works</summary><p>Ranked by your best streak this season: the most wins in a row. Players with the same best streak share a rank. Lose and your streak resets, but you can start a new one the next week. Green is a win, red is a loss. Picks stay hidden until the card starts. Tap any player to see their profile.</p></details>`;
}

/* ---------- PLAYER PROFILE ---------- */
const cleanHandle = (v) => String(v || '').trim().replace(/^(https?:\/\/)?(www\.)?(instagram\.com|x\.com|twitter\.com)\//i, '').replace(/^@|[/?#].*$/g, '');
async function openPlayer(userId) {
  if (!userId || !S.season) return;
  openDialog(`<div id="plbody"><div class="empty" style="margin:8px 0;border:0"><b>Loading player</b></div></div>`);
  $('#sheetroot .sheet')?.classList.add('player');
  try { S.player = await api.player(userId, S.season.id); }
  catch (err) { const b = $('#plbody'); if (b) b.innerHTML = `<div class="empty" style="margin:8px 0;border:0"><b>Couldn't load this player</b>${esc(err.message)}</div>`; return; }
  const b = $('#plbody'); if (b) b.innerHTML = playerHTML(S.player);
}
function playerHTML(p) {
  const e = p.entry, curW = S.openEvent?.week_no || 1;
  let joined = ''; try { joined = new Date(p.joined_at).toLocaleDateString(undefined, { month: 'short', year: 'numeric' }); } catch (x) {}
  const status = !e ? `Not playing ${esc(S.season.name)}` : e.status === 'out' ? `Ended in week ${e.out_week ?? '?'}${e.out_reason && e.out_reason !== 'loss' ? ` (${esc(e.out_reason)})` : ''}` : (e.run_start_week ?? e.start_week) > curW ? `Starts week ${e.run_start_week ?? e.start_week}` : '';
  const badge = e ? `<span class="badge ${e.status}">${e.status === 'alive' ? 'On a streak' : 'Streak ended'}</span>` : '';
  const soc = (p.instagram ? `<a class="soc" href="https://instagram.com/${encodeURIComponent(p.instagram)}" target="_blank" rel="noopener noreferrer">${I.ig}${esc(p.instagram)}</a>` : '')
    + (p.x_handle ? `<a class="soc" href="https://x.com/${encodeURIComponent(p.x_handle)}" target="_blank" rel="noopener noreferrer">${I.xlogo}${esc(p.x_handle)}</a>` : '');
  const btn = p.is_me ? `<button class="btn btn-ghost btn-sm" data-act="profile">Edit profile</button>`
    : `<button class="btn ${p.following ? 'btn-ghost' : 'btn-dark'} btn-sm" data-act="follow" data-user="${esc(p.user_id)}" aria-pressed="${!!p.following}">${p.following ? `${I.check} Following` : '★ Follow'}</button>`;
  let h = `<div class="pl-head"><button class="avbtn" data-act="bigphoto" ${p.avatar_url ? `data-src="${esc(p.avatar_url)}"` : 'disabled'} aria-label="See ${esc(p.username)}'s photo">${avatarHTML(p.avatar_url, p.username, 'xxl')}</button>
    <div class="t"><b class="c">${esc(p.username)}</b><small>${badge}${status}</small><small>${plural(Number(p.followers) || 0, 'follower')}${joined ? ` · Joined ${esc(joined)}` : ''}</small></div></div>
    <div class="pl-acts">${btn}${soc}</div>`;
  if (p.is_me && p.socials_public === false && (p.instagram || p.x_handle)) h += `<p class="muted" style="font-size:13px;margin:8px 0 0">Your Instagram and X are hidden from other players.</p>`;
  if (!e) return h;
  const shown = (p.picks || []).filter((x) => x.pick_pct != null && x.result !== 'pending');
  const avg = shown.length ? Math.round(shown.reduce((t, x) => t + x.pick_pct, 0) / shown.length) : null;
  const style = avg == null ? 'Pick style' : avg >= 65 ? 'Plays it safe' : avg >= 50 ? 'Balanced' : 'Risk taker';
  const cur = e.current ?? (e.status === 'alive' ? e.wins : 0), best = e.best ?? e.wins;
  h += `<div class="pl-stats">
    <div><b class="c tnum">${cur}</b><small>Current streak${cur >= 3 ? ' 🔥' : ''}</small></div>
    <div><b class="c tnum">${best}</b><small>Best streak</small></div>
    <div><b class="c tnum">${best > 0 && e.rank ? '#' + e.rank : '–'}</b><small>Rank of ${Number(e.players || 0).toLocaleString()}</small></div>
    <div><b class="c tnum">${avg == null ? '–' : avg + '%'}</b><small>${style}</small></div></div>`;
  if (p.boldest) h += `<div class="pl-bold">${avatarHTML(p.boldest.headshot_url, p.boldest.fighter_name, 'm')}<span>Boldest win: <b>${esc(p.boldest.fighter_name)}</b> at ${p.boldest.pick_pct}% to win, week ${p.boldest.week_no}</span></div>`;
  const byWeek = Object.fromEntries((p.picks || []).map((x) => [x.week_no, x]));
  const last = Math.max(e.status === 'out' ? (e.out_week || 1) : Math.max(e.run_start_week ?? e.start_week, curW), ...(p.picks || []).map((x) => x.week_no || 0));
  const chips = [];
  for (let w = e.start_week; w <= last; w++) {
    const x = byWeek[w];
    if (x) chips.push(`<span class="wk ${x.result === 'pending' ? 'pend' : x.result}" title="Week ${w}: ${esc(x.fighter_name || '')}${x.pick_pct != null ? ` (${x.pick_pct}% to win)` : ''}">${avatarHTML(x.headshot_url, x.fighter_name)}W${w}</span>`);
    else if (w === curW && e.status === 'alive' && !openLocked()) chips.push(`<span class="wk hid" title="Hidden until the card starts"><span class="av">${I.lock}</span>W${w}</span>`);
    else chips.push(`<span class="wk none"><span class="av"></span>W${w}</span>`);
  }
  h += `<div class="pl-sec">Picks</div><div class="weeks">${chips.join('')}</div>`;
  if (!p.is_me && !S.isAdmin && e.status === 'alive' && !openLocked()) h += `<p class="muted" style="font-size:12px;margin:8px 0 0">This week's pick shows once the card starts.</p>`;
  return h;
}

/* ---------- ADMIN ---------- */

}
function arowHTML(r) {
  const soc = [r.instagram && `IG @${r.instagram}`, r.x_handle && `X @${r.x_handle}`].filter(Boolean).join(' · ');
  const st = !r.entry_id ? 'No picks yet' : `${r.status === 'out' ? `Streak ended in week ${r.out_week ?? ''}` : `${r.wins || 0} in a row`}, best ${r.best ?? r.wins ?? 0}${r.runs > 1 ? `, ${r.runs} streaks` : ''}`;
  const pk = r.pick_fighter ? `<span class="pk">${avatarHTML(r.pick_headshot, r.pick_fighter, 's')}<span>${esc(r.pick_last_name || r.pick_fighter)}<small>${r.pick_pct != null ? r.pick_pct + '%' : ''}</small></span></span>`
    : r.entry_id && r.status === 'alive' ? '<span class="pk none">No pick</span>' : '';
  return `<button class="arow" data-act="player" data-user="${esc(r.user_id)}">${avatarHTML(r.avatar_url, r.username, 'm')}<span class="t"><b>${esc(r.username)}</b><small>${esc(r.email || '')}${r.phone ? ` · ${esc(r.phone)}` : ''}</small><small>${esc(st)}${soc ? ` · ${esc(soc)}${r.socials_public === false ? ' (hidden)' : ''}` : ''}</small></span>${pk}</button>`;
}
function adminCSV() {
  const cols = [['username', 'username'], ['email', 'email'], ['phone', 'phone'], ['instagram', 'instagram'], ['x', 'x_handle'], ['socials_public', 'socials_public'], ['joined', 'joined_at'],
    ['status', 'status'], ['current_streak', 'wins'], ['best_streak', 'best'], ['streaks', 'runs'], ['underdog_wins', 'dog_wins'], ['start_week', 'start_week'], ['out_week', 'out_week'], ['out_reason', 'out_reason'],
    ['this_week_pick', 'pick_fighter'], ['pick_win_pct', 'pick_pct'], ['picked_at', 'picked_at'], ['followers', 'followers']];
  const cell = (v) => { let s = v == null ? '' : String(v); if (/^[=+\-@]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = [cols.map((c) => c[0]).join(','), ...S.admin.players.map((r) => cols.map((c) => cell(r[c[1]])).join(','))].join('\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  const a = document.createElement('a'); a.href = url; a.download = `mma-survivor-players-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 3000);
}

/* ---------- RULES ---------- */
// A prize with no text in prize_tiers is not announced yet: show a teaser instead.
const prizeText = (p) => (p && typeof p.prize === 'string' && p.prize.trim()) ? p.prize.trim() : null;
function viewRules() {
  const tiers = S.prizes.filter((p) => p.wins > 0).sort((a, b) => a.wins - b.wins), champ = S.prizes.find((p) => p.wins === 0);
  const first = tiers[0];
  return `<h1 class="h1 c">How it works</h1><p class="lead">${esc(S.season.name)} runs for ${S.season.weeks} UFC events. Build the longest streak you can.</p>
  <div class="prizes">${[...tiers, champ].some((p) => p && !prizeText(p)) ? `<div class="tease"><b>Prizes start at ${first ? first.wins : 10} in a row 👀</b><span>We're cooking something big. Hit a ${first ? first.wins : 10}-fight streak to unlock the first prize, then keep going for more.</span></div>` : ''}
  ${tiers.map((t) => `<div class="prize"><span class="n c tnum">${t.wins}<small>in a row</small></span><span>${t.title && t.title.toLowerCase() !== `${t.wins} in a row` ? `<b>${esc(t.title)}</b>` : `<b>${t.wins}-fight streak</b>`}${prizeText(t) ? `<span>${esc(prizeText(t))}</span>` : `<span class="soon">${I.lock}Revealed soon</span>`}</span></div>`).join('')}
  ${champ ? `<div class="prize champ"><span class="n c">#1</span><span><b>${esc(champ.title)}</b><span>${prizeText(champ) ? `${esc(prizeText(champ))}. ` : '<span class="soon">Revealed soon.</span> '}Longest streak of the season.</span></span></div>` : ''}</div>
  <h2 class="h2 c">Rules</h2>
  <ul class="rules">
    <li><b>Pick one fighter every UFC card</b> to win. Any fight on the card counts.</li>
    <li><b>Win and your streak grows.</b> Lose and it resets to 0.</li>
    <li><b>Lost? You're straight back in.</b> Make next week's pick and a new streak starts. Join any week.</li>
    <li><b>The leaderboard ranks your best streak</b> this season. Players with the same best streak share a rank.</li>
    <li><b>Picks lock when the first fight starts</b>, early prelims included. Change your pick as often as you like before then. No pick by then and your streak ends.</li>
    <li><b>Picks are secret</b> until the card starts. Then everyone's pick shows on the leaderboard.</li>
    <li><b>Hit 3 in a row</b> and we'll ask for your phone number so we can reach you about prizes. You need it to keep your streak going.</li>
    <li><b>Win %</b> next to each fighter is their chance to win based on the betting odds. It updates until the card starts.</li>
    <li><b>Draw, no contest or cancelled fight</b> counts as a loss. Your fighter has to win. If your fight is cancelled before lock, switch your pick.</li>
  </ul>
  <details class="fine"><summary>Fine print</summary><p>Prizes and how they are awarded will be announced by Home of Fight before anything is given out. Each milestone counts once per player. Results come from ESPN and are graded automatically; corrections within 72 hours are applied, then results are final. If the UFC cancels a whole event, that week doesn't count. Phone numbers are only used by Home of Fight to contact you about the game and prizes. Profile photos must be of you or something you have the right to use; Home of Fight can remove any photo. Free to play, no purchase necessary. One account per person; duplicate accounts are disqualified. You must be 18 or older to receive a prize, and Home of Fight may verify identity before awarding one. Home of Fight's decisions are final. Not affiliated with the UFC or ESPN.</p></details>`;
}

/* ---------- SIDE PANEL (desktop) ---------- */
function viewAside() {
  let h = '';
  if (S.me?.profile) {
    const e = S.entry, p = S.openEvent && pickFor(S.openEvent.id), alive = e?.status === 'alive';
    const sub = !e ? 'Make your first pick' : !alive ? 'Streak ended. Make a pick to start again' : p ? `This week: ${esc(lastName(p.fighter))}` : e.start_week > (S.openEvent?.week_no ?? 0) ? `Starts week ${e.start_week}` : 'No pick yet this week';
    h += `<div class="panel"><h3 class="c">My season <button data-act="tab" data-tab="season">Details</button></h3>
      <div class="prow">${avatarHTML(S.me.profile.avatar_url, S.me.profile.username, 'm')}<span class="t">${esc(S.me.profile.username)}<small>${sub}</small></span><span class="w c tnum" title="Current streak">${alive ? e.wins : 0}</span></div></div>`;
  }
  const st = S.stats || { alive: 0, players: 0 };
  const any = S.top.some((x) => x.wins > 0);
  h += `<div class="panel"><h3 class="c">${any ? 'Top 5' : 'Players'} <button data-act="tab" data-tab="board">Full board</button></h3>${S.top.length ? S.top.map((r) => `<button class="prow" data-act="player" data-user="${esc(r.user_id)}"><span class="c tnum" style="width:18px;text-align:center">${rankOf(r)}</span>${avatarHTML(r.avatar_url, r.username, 'm')}<span class="t">${esc(r.username)}<small>${streakLine(r)}</small></span><span class="w c tnum" title="Best streak">${r.wins}</span></button>`).join('') : '<p class="muted" style="margin:0">No players yet.</p>'}
    <p class="muted tnum" style="margin:10px 0 0;font-size:13px">${st.alive.toLocaleString()} of ${st.players.toLocaleString()} players on a streak</p></div>`;
  return h;
}

      try { await api.setFollow(id, on); } finally { el.disabled = false; }
      if (on) S.following.add(id); else S.following.delete(id);
      if (S.player?.user_id === id) { S.player.following = on; S.player.followers = Math.max(0, Number(S.player.followers || 0) + (on ? 1 : -1)); const b = $('#plbody'); if (b) b.innerHTML = playerHTML(S.player); }
      toast(on ? `Following ${S.player?.username || 'player'}` : `Unfollowed ${S.player?.username || 'player'}`);
      if (S.tab === 'board' || S.tab === 'season') { await loadTab(); render(); }
    }
    else if (a === 'bigphoto') {
      if (!el.dataset.src) return;
      const lb = document.createElement('div'); lb.className = 'lightbox'; lb.dataset.act = 'closelb';
      lb.innerHTML = `<img src="${esc(el.dataset.src)}" alt="">`; document.body.appendChild(lb);
    }
    else if (a === 'closelb') el.remove();
    else if (a === 'adfilter') { S.admin.filter = el.dataset.f; S.admin.limit = 100; render(); }
    else if (a === 'adsplit') { S.admin.allSplit = true; render(); }
    else if (a === 'admore') { S.admin.limit += 100; render(); }
    else if (a === 'adrefresh') { await loadAdmin(); render(); toast('Admin data refreshed'); }
    else if (a === 'adcsv') adminCSV();
    else if (a === 'demoadmin') {
      if (!S.me?.profile) { toast('Sign up in the demo first, then switch on admin view', true); return; }
      const on = api.toggleAdmin(); await refresh(); if (on) { S.tab = 'admin'; await loadTab(); render(); }
      toast(on ? 'Admin view on (demo)' : 'Admin view off');
    }
    else if (a === 'auth') { if (S.me) return profileDialog(); authDialog(el.dataset.mode || 'up'); }
    else if (a === 'profile') { if (!S.me) return authDialog('up'); profileDialog(); }
    else if (a === 'close') closeDialog();
    else if (a === 'signout') { await api.signOut(); closeDialog(); S.draft = null; await refresh(); toast('Signed out'); }
    else if (a === 'forgot') {
      const email = $('#au-email').value.trim();
      if (!email) { $('#au-err').textContent = 'Enter your email above, then tap Forgot password.'; return; }
      await api.resetPassword(email); toast('Check your email for a reset link');
    }
    else if (a === 'rmphoto') { S.photo = null; $('#pf-photo').innerHTML = photoPickerHTML(); }
    else if (a === 'join' || a === 'gopick') {
      S.tab = 'pick'; store.set('hof-survivor-tab', 'pick'); S.viewEventId = S.openEvent?.id; S.fightsFor = null; render(); await loadFights(); render();
      requestAnimationFrame(() => { const t = $('#card-top'); if (t) t.scrollIntoView({ block: 'start' }); else window.scrollTo({ top: 0 }); });
    }
    else if (a === 'scrollcard') { const t = $('#card-top'); if (t) t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); }
    else if (a === 'phone') { if (!S.me?.profile) return profileDialog(); phoneDialog(false); }
    else if (a === 'week') {
      const weeks = S.events.filter((e) => e.week_no != null);
      const i = weeks.findIndex((e) => e.id === S.viewEventId);
      const dir = Number(el.dataset.dir);
      S.viewEventId = dir === 0 ? S.openEvent?.id : (weeks[i + dir] || weeks[i]).id;
      S.draft = null; S.fightsFor = null; render(); await loadFights(); render();
    }
    else if (a === 'tape') { S.tape[el.dataset.fight] = !S.tape[el.dataset.fight]; render(); }
    else if (a === 'pick') {
      if (!S.me) return authDialog('up');
      if (!S.me.profile) return profileDialog();
      const ctx = pickCtx();
      if (!ctx.canPick) return;
      const { fight: fightId, fighter: fighterId } = el.dataset;
      S.draft = { fightId, fighterId };
      render();
    }
    else if (a === 'cancelpick') { S.draft = null; render(); }
    else if (a === 'savepick') {
      const d = S.draft; if (!d || d.saving) return;
      // a 3-win streak needs a phone number before the next pick
      if (S.entry?.status === 'alive' && S.entry.wins >= 3 && !S.phone) return phoneDialog(true);
      d.saving = true; renderSheet();
      try {
        const fresh = !S.entry || S.entry.status !== 'alive';
        const entry = fresh ? await api.join() : S.entry;   // lost or new: this pick starts a new streak
        await api.makePick(entry.id, d.fightId, d.fighterId);
        const f = fighterIn(d.fightId, d.fighterId);
        S.draft = null; await loadMe(); render();
        toast(fresh && S.entries.length > 1 ? `New streak started: ${f?.name}` : `Pick saved: ${f?.name}`);
      } catch (err) {
        d.saving = false; renderSheet();
        if (/phone number/i.test(err.message || '')) { S.phone = null; return phoneDialog(true); }
        throw err;
      }
    }
    else if (a === 'share') await shareCard();
    else if (a === 'sharefmt') { SHARE.fmt = el.dataset.f; store.set('hof-survivor-sharefmt', SHARE.fmt); renderShare(); }
    else if (a === 'shareto') shareTo(el.dataset.to);
    else if (a === 'sharelink') { try { await navigator.clipboard.writeText(SHARE_LINK); shareNote('Link copied. Add it as a link sticker on your story.'); } catch (err) { shareNote(SHARE_LINK); } }
    else if (a === 'lbfilter') { S.lb.filter = el.dataset.f; await loadBoard(); render(); }
    else if (a === 'lbmore') { await loadBoard(true); render(); }
    else if (a === 'simulate') { api.simulate(); S.draft = null; S.viewEventId = null; await refresh({ season: true }); toast('Fight night simulated with random, odds-weighted results'); }
    else if (a === 'resetdemo') { api.reset(); S.draft = null; S.viewEventId = null; await refresh({ season: true }); toast('Demo reset'); }
  } catch (err) { toast(err.message || String(err), true); }
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  act(el);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { const lb = document.querySelector('.lightbox'); if (lb) { lb.remove(); return; } if ($('#sheetroot').dataset.kind === 'dialog') closeDialog(); else if (S.draft) { S.draft = null; render(); } } });
let searchTimer;
document.addEventListener('input', (e) => {
  if (e.target.id === 'adsearch') { S.admin.q = e.target.value.trim(); S.admin.limit = 100; render(); const s = $('#adsearch'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } return; }
  if (e.target.id === 'lbsearch') { clearTimeout(searchTimer); searchTimer = setTimeout(async () => { S.lb.q = e.target.value.trim(); await loadBoard(); render(); const s = $('#lbsearch'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 300); }
});
document.addEventListener('change', async (e) => {
  if (e.target.id !== 'pf-file') return;
  const file = e.target.files?.[0]; e.target.value = '';
  if (!file) return;
  try { S.photo = await squarePhoto(file, api?.demo ? 320 : 640); $('#pf-photo').innerHTML = photoPickerHTML(); $('#pf-err').textContent = ''; }
  catch (err) { $('#pf-err').textContent = err.message; }
});
document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const btn = f.querySelector('button[type=submit]');
  try {
    if (btn) btn.disabled = true;
    if (f.id === 'authform') {
      const email = $('#au-email').value.trim(), pass = $('#au-pass').value;
      $('#au-err').textContent = '';
      if (f.dataset.mode === 'up') {
        const r = await api.signUp(email, pass);
        if (r.needsConfirm) { closeDialog(); toast('Check your email to confirm your account, then log in'); return; }
      } else await api.signIn(email, pass);
      closeDialog(); await refresh();
      if (!S.me?.profile) profileDialog(); else toast(`Welcome back, ${S.me.profile.username}`);
    } else if (f.id === 'profform') {
      $('#pf-err').textContent = '';
      const had = !!S.me.profile;
      let socials = null;
      if ($('#pf-ig')) {
        const ig = cleanHandle($('#pf-ig').value), x = cleanHandle($('#pf-x').value), pub = $('#pf-pub').checked;
        if (ig && !/^[A-Za-z0-9._]{1,30}$/.test(ig)) throw new Error('That Instagram handle does not look right');
        if (x && !/^[A-Za-z0-9_]{1,15}$/.test(x)) throw new Error('That X handle does not look right');
        const prev = S.socials || {};
        if (ig !== (prev.instagram || '') || x !== (prev.x_handle || '') || pub !== (prev.is_public !== false)) socials = { ig: ig || null, x: x || null, pub };
      }
      let phone = null;
      if ($('#pf-phone')) {
        const raw = $('#pf-phone').value.trim();
        if (raw) { phone = cleanPhone(raw); if (!phone) throw new Error('That phone number does not look right. Include your country code'); if (phone === S.phone) phone = null; }
      }
      await api.saveProfile($('#pf-name').value.trim());
      if (!had) S.me.profile = { username: $('#pf-name').value.trim() };
      if (S.photo) await api.uploadAvatar(S.photo);
      else if (S.photo === null && had) await api.removeAvatar();
      if (socials) await api.saveSocials(socials.ig, socials.x, socials.pub);
      if (phone) S.phone = await api.setPhone(phone);
      S.photo = undefined;
      closeDialog(); await refresh();
      if (!had) { S.tab = 'pick'; render(); toast("You're in. Tap a fighter to make your pick."); }
      else toast('Profile saved');
    } else if (f.id === 'pwform') { await api.setPassword($('#pw-new').value); closeDialog(); toast('Password updated'); }
    else if (f.id === 'phoneform') {
      $('#ph-err').textContent = '';
      const v = cleanPhone($('#ph-num').value);
      if (!v) throw new Error('That phone number does not look right. Include your country code');
      S.phone = await api.setPhone(v);
      const resume = f.dataset.resume === '1';
      closeDialog(); toast('Phone number saved');
      if (resume && S.draft) await act({ dataset: { act: 'savepick' } });
      else render();
    }
  } catch (err) {
    const box = f.querySelector('.err'); if (box) box.textContent = err.message; else toast(err.message, true);
  } finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
});

/* countdowns, the moment the card starts, and live polling */
setInterval(() => {
  document.querySelectorAll('[data-count]').forEach((el) => { el.textContent = countdown(new Date(el.dataset.count) - now()); });
  const ev = viewEvent();
  if (ev && S.fightsFor === ev.id) {
    const lockedNow = weekLocked(ev, S.fights);
    if (lockedNow !== S.locked) { S.locked = lockedNow; if (lockedNow) { S.draft = null; refresh({ quiet: true }); } else render(); }
  }
}, 15000);
let lastPoll = Date.now();
setInterval(() => {
  if (document.hidden || !S.season || api?.demo || S.draft || $('#sheetroot').dataset.kind) return;
  const live = S.openEvent?.status === 'live' || S.fights.some((f) => f.status === 'live');
  const soon = Math.abs(lockAtOf(viewEvent(), S.fights) - now()) < 3600e3;
  if (Date.now() - lastPoll >= (live || soon ? 60e3 : 300e3)) { lastPoll = Date.now(); refresh({ season: S.openEvent?.status === 'final' || live, quiet: true }); }
}, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.season && !api?.demo && Date.now() - lastPoll > 60e3) { lastPoll = Date.now(); refresh({ season: true, quiet: true }); } });

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Couldn't connect to the game server. Check your connection and reload.")); document.head.appendChild(s); }); }
(async function boot() {
  $('#footlogo').src = LOGO_WORDMARK;
  $('#brandlogo').src = LOGO_MAIN;
  $('#hofmark').src = LOGO_WORDMARK;
  render();
  setTimeout(loadShareFonts, 1500);
  try {
    if (DEMO) api = DemoAPI();
    else {
      await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js');
      api = SupabaseAPI();
      api.sb.auth.onAuthStateChange((evt) => {
        if (evt === 'PASSWORD_RECOVERY') passwordDialog();
        if (evt === 'SIGNED_IN' || evt === 'SIGNED_OUT') setTimeout(() => refresh({ quiet: true }), 0);
      });
    }
  } catch (e) { S.loading = false; S.error = e.message; render(); return; }
  await refresh({ season: true });
})();
</script>
</body>
